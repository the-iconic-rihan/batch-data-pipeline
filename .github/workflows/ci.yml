name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (incl. PySpark)
        run: pytest -v

  docker:
    name: Docker build & DAG integrity
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet

      - name: Build Airflow image
        run: docker build -t bdp-airflow:ci airflow

      - name: DAG integrity test (DAG imports cleanly inside the real image)
        run: |
          docker run --rm \
            -v "$PWD/dags:/opt/airflow/dags" \
            -v "$PWD/pipeline:/opt/airflow/pipeline" \
            -e PYTHONPATH=/opt/airflow \
            bdp-airflow:ci \
            python -c "
          from airflow.models import DagBag
          bag = DagBag('/opt/airflow/dags', include_examples=False)
          assert not bag.import_errors, bag.import_errors
          dag = bag.dags['daily_orders_pipeline']  # no metadata DB needed
          assert dag.get_task('transform').upstream_task_ids == {'extract'}
          assert dag.get_task('load').upstream_task_ids == {'transform'}
          print('OK:', bag.dag_ids)
          "
